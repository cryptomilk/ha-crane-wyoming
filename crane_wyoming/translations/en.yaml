---
configuration:
  model_path:
    name: Model Path
    description: >-
      Directory containing TTS/ASR model subdirectories (tts/ and asr/).
  default_tts_model:
    name: Default TTS Model
    description: >-
      TTS model to download on first run if none is present. Set to "none"
      to skip downloading.
  default_asr_model:
    name: Default ASR Model
    description: >-
      ASR model to download on first run if none is present. Set to "none"
      to skip downloading.
  cpu_only:
    name: CPU Only
    description: Force CPU inference, even if a GPU is available.
  max_connections:
    name: Max Connections
    description: Maximum number of concurrent Wyoming client connections.
  tts_cache_enabled:
    name: Enable TTS Cache
    description: Cache synthesized audio on disk to speed up repeated phrases.
  tts_cache_max_size:
    name: TTS Cache Max Size
    description: Maximum size of the on-disk TTS cache (e.g. "500M", "2G").
  debug_logging:
    name: Debug Logging
    description: Enable verbose (debug-level) logging.
network:
  10200/tcp: Wyoming protocol
